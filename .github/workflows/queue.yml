name: Encrypted approved cloud queue
on:
  workflow_dispatch:
    inputs:
      mode:
        description: Read-only verification or one approved queue creation
        type: choice
        required: true
        default: verify
        options:
          - verify
          - publish
  schedule:
    - cron: '17 7 2-29 11 *'
permissions:
  contents: write
concurrency:
  group: sealed-snap-cloud-queue
  cancel-in-progress: false
jobs:
  queue:
    if: vars.QUEUE_ZERO_COST_VERIFIED == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Guard mode and year before checkout or install
        id: guard
        env:
          QUEUE_MODE: ${{ github.event_name == 'schedule' && 'publish' || inputs.mode || 'verify' }}
          PUBLISH_ENABLED: ${{ vars.CLOUD_PUBLISH_ENABLED }}
        run: |
          python3 - <<'PY'
          import datetime as d, os
          day = d.datetime.now(d.timezone(d.timedelta(hours=3))).date()
          mode = os.environ['QUEUE_MODE']
          allowed = mode == 'verify' and d.date(2026,11,1) <= day <= d.date(2026,12,1)
          if mode == 'publish':
              allowed = os.environ['PUBLISH_ENABLED'] == 'true' and d.date(2026,11,2) <= day <= d.date(2026,11,29)
          with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
              f.write('allowed=' + str(allowed).lower() + '\nmode=' + mode + '\n')
          print('date_and_mode_allowed' if allowed else 'date_or_mode_closed_no_api')
          PY
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        if: steps.guard.outputs.allowed == 'true'
        with:
          fetch-depth: 0
      - name: Verify public repository
        if: steps.guard.outputs.allowed == 'true'
        env:
          IS_PRIVATE: ${{ github.event.repository.private }}
        run: test "$IS_PRIVATE" = "false"
      - name: Install pinned encryption dependency
        if: steps.guard.outputs.allowed == 'true'
        run: |
          python3.12 -c 'import platform,sys; assert sys.version_info[:2] == (3,12) and platform.machine() == "x86_64"'
          python3.12 -m venv "$RUNNER_TEMP/snap-publisher-venv"
          "$RUNNER_TEMP/snap-publisher-venv/bin/python" -m pip install --disable-pip-version-check --require-hashes --only-binary=:all: -r requirements.txt
      - name: Configure encrypted checkpoint identity
        if: steps.guard.outputs.allowed == 'true' && steps.guard.outputs.mode == 'publish'
        run: |
          git config user.name 'Cloud queue checkpoint'
          git config user.email 'queue@users.noreply.github.com'
      - name: Read-only verification (two GETs)
        if: steps.guard.outputs.allowed == 'true' && steps.guard.outputs.mode == 'verify'
        env:
          SNAP_QUEUE_SEAL_KEY: ${{ secrets.SNAP_QUEUE_SEAL_KEY }}
          BULKPUBLISH_API_KEY: ${{ secrets.BULKPUBLISH_API_KEY }}
          QUEUE_ZERO_COST_VERIFIED: ${{ vars.QUEUE_ZERO_COST_VERIFIED }}
        run: '"$RUNNER_TEMP/snap-publisher-venv/bin/python" sealed_runner.py run --root "$GITHUB_WORKSPACE" --mode verify'
      - name: Queue one approved item
        if: steps.guard.outputs.allowed == 'true' && steps.guard.outputs.mode == 'publish'
        env:
          SNAP_QUEUE_SEAL_KEY: ${{ secrets.SNAP_QUEUE_SEAL_KEY }}
          BULKPUBLISH_API_KEY: ${{ secrets.BULKPUBLISH_API_KEY }}
          QUEUE_ZERO_COST_VERIFIED: ${{ vars.QUEUE_ZERO_COST_VERIFIED }}
        run: '"$RUNNER_TEMP/snap-publisher-venv/bin/python" sealed_runner.py run --root "$GITHUB_WORKSPACE" --mode publish --execute'
