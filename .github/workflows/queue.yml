name: Encrypted approved cloud queue
on:
  workflow_dispatch:
    inputs:
      mode:
        description: Read-only Pro entitlement and quota check
        type: choice
        required: true
        default: verify
        options:
          - verify
permissions:
  contents: read
jobs:
  snap-pro-evidence:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/codex/snap-pro-evidence-20261105' && github.repository == 'taqdeersa/approved-content-queue-2026-11' && github.event.repository.private == false && inputs.mode == 'verify'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Verify one-off date window
        run: test "$(TZ=Asia/Riyadh date +%F)" = "2026-11-05"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Install pinned encryption dependency
        run: |
          python3.12 -c 'import platform,sys; assert sys.version_info[:2] == (3,12) and platform.machine() == "x86_64"'
          python3.12 -m venv "$RUNNER_TEMP/snap-pro-evidence"
          "$RUNNER_TEMP/snap-pro-evidence/bin/python" -m pip install --disable-pip-version-check --require-hashes --only-binary=:all: -r requirements.txt
      - name: Read-only Pro evidence (five GETs)
        env:
          SNAP_QUEUE_SEAL_KEY: ${{ secrets.SNAP_QUEUE_SEAL_KEY }}
          BULKPUBLISH_API_KEY: ${{ secrets.BULKPUBLISH_API_KEY }}
        run: '"$RUNNER_TEMP/snap-pro-evidence/bin/python" snap_pro_readback.py'
